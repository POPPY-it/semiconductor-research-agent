services:
  api:
    build: .
    container_name: semiconductor-agent
    ports:
      - "8000:8000"
    environment:
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - API_TOKEN=${API_TOKEN}
      - APP_QUEUE=${APP_QUEUE:-thread}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./data:/app/data          # 文章库/应用库/向量库/模型（持久化）
      - ./reports:/app/reports    # 研报产物
    restart: unless-stopped

  # 规模化路径（可选）：APP_QUEUE=rq 时启用 worker + redis
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
  # worker:
  #   build: .
  #   command: rq worker --url redis://redis:6379/0
  #   environment: (同上)
  #   volumes: (同上)
